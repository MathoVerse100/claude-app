{# Swaps the whole shell in the requested language without a full reload. #}
<div class="flex items-center gap-1 rounded-full border border-border p-1" role="group" aria-label="{{ t('nav.language') }}">
  {% for loc in config.app.app.locales %}
  <button type="button"
          hx-post="{{ config.endpoints.set_language }}"
          hx-vals='{"lang": "{{ loc.code }}"}'
          hx-target="#app-shell"
          hx-swap="innerHTML"
          {% if loc.code == lang %}aria-current="true"{% endif %}
          title="{{ loc.name }}"
          class="min-h-[44px] min-w-[44px] rounded-full px-3 text-sm font-medium transition-colors {{ 'bg-accent text-accent-fg' if loc.code == lang else 'text-muted hover:text-fg' }}">
    {{ loc.label }}
  </button>
  {% endfor %}
</div>
