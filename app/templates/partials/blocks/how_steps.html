<ol class="grid gap-10 sm:grid-cols-2 lg:grid-cols-4">
  {% for step in t('how.steps') %}
  <li class="relative border-t border-border pt-6">
    <span class="absolute -top-px left-0 h-px w-16 bg-accent"></span>
    <p class="text-sm text-muted">{{ t('how.step_label', n=loop.index) }}</p>
    <h3 class="mt-2 text-2xl font-semibold">{{ step.title }}</h3>
    <p class="mt-3 text-muted">{{ step.body }}</p>
  </li>
  {% endfor %}
</ol>
